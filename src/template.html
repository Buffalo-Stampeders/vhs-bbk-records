<title>VHS Boys Basketball Record Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: hero band + sticky filter bar + sectioned record tables. Styled to match athletics.tvcs.org (SIDEARM: Open Sans, forest green, tan). Single light theme on purpose: it lives inside the athletics site. */
:root{
  --forest:#00492B; --forest-dark:#002f1c; --tan:#bc9b6a; --tan-dim:rgba(188,155,106,.28); --tan-ink:#6b5230;
  --paper:#f7f5f0; --ink:#17231d; --muted:#5f6a63; --card:#ffffff; --card-line:#e4e1d6; --line:rgba(188,155,106,.28);
  --row-alt:#faf8f3; --hi:#fff1c9; --live-row:rgba(188,155,106,.14);
  --bg:var(--paper); --fg:var(--ink); --surface:var(--card); --accent:var(--forest); --accent-fg:#fff;
  --f:"Open Sans",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--forest)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
/* hero */
.band{position:relative;overflow:hidden;color:#fff;border-bottom:6px solid var(--tan);background:radial-gradient(1200px 500px at 85% -10%,rgba(188,155,106,.12),transparent 60%),linear-gradient(160deg,var(--forest) 0%,var(--forest-dark) 100%)}
.band::after{content:"";position:absolute;right:-60px;top:-60px;width:320px;height:320px;border:2px solid rgba(188,155,106,.2);border-radius:50%}
header .wrap{padding-block:46px 40px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;position:relative;z-index:2}
.eyebrow{font-size:.68rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--tan);margin:0 0 8px}
h1{margin:0;font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.15;font-weight:700;text-wrap:balance}
h1 span{color:var(--tan)}
.meta{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.82)}
.meta b{color:#fff;font-variant-numeric:tabular-nums}
#m-live{background:var(--tan);color:var(--forest-dark);padding:4px 10px;border-radius:4px}
#m-live b{color:var(--forest-dark)}
/* sticky filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--card-line);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.bar .wrap{padding-block:14px;display:grid;gap:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--f);font-size:.78rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:#fff;border:1.5px solid var(--forest);color:var(--forest);padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tab:hover{background:rgba(0,73,43,.08)}
.tab[aria-selected="true"]{background:var(--forest);color:#fff}
.tab:focus-visible,.sel:focus-visible,#q:focus-visible,#clear:focus-visible,th button:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
.controls{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(150px,1fr)) auto;gap:10px;align-items:center}
@media (max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls .search{grid-column:1/-1}}
.search{position:relative;display:flex;align-items:center}
#q{width:100%;font-family:var(--f);font-size:.9rem;color:var(--ink);background:#fff;border:1.5px solid #d8d4c6;border-radius:999px;padding:10px 14px 10px 38px}
#q:focus{outline:none;border-color:var(--forest)}
#q::placeholder{color:#a5a599}
.search svg{position:absolute;left:13px;width:16px;height:16px;fill:none;stroke:#9a9a8e;stroke-width:2;pointer-events:none}
.sel{font-family:var(--f);font-size:.78rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--forest);background:#fff;border:1.5px solid var(--forest);border-radius:6px;padding:8px 12px;width:100%;min-width:0;cursor:pointer}
#clear{appearance:none;background:none;border:none;color:var(--tan);font-family:var(--f);font-size:.75rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:8px 6px}
#clear:hover{color:var(--forest)}
/* content */
main .wrap{padding-block:28px 56px}
.status{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.status .count{font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--tan)}
.status .count b{color:var(--forest);font-variant-numeric:tabular-nums}
.status .hint{font-size:.8rem;color:var(--muted)}
.more{display:flex;align-items:center;gap:14px;padding:10px 0 4px}
.more .morebtn{background:var(--forest);color:#fff;border:0;border-radius:4px;padding:8px 14px;font:700 .8rem var(--f);letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.more .morebtn:hover{background:var(--forest-dark)}
.more span{font-size:.8rem;color:var(--muted)}
.group{margin-bottom:34px}
.group h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px;color:var(--forest);font-size:1.25rem;font-weight:700;margin:0 0 12px;padding-bottom:8px;border-bottom:3px solid var(--forest)}
.group h2 small{color:var(--tan);font-weight:600;font-size:.75rem;letter-spacing:1px;text-transform:uppercase}
.group h2 .sec{color:var(--muted);font-weight:500;font-size:.95rem}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--card-line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid #eeebe2}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:var(--row-alt)}
th{background:var(--forest);color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:.68rem;position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
th button::after{content:"";width:0;height:0;border:4px solid transparent;opacity:.35}
th button[data-dir="asc"]::after{border-bottom-color:currentColor;border-top:0;opacity:1}
th button[data-dir="desc"]::after{border-top-color:currentColor;border-bottom:0;opacity:1}
td.num{text-align:right;font-weight:700;color:var(--forest)}
th.num{text-align:right}
td.rank{color:#a5a599;width:2.6em;text-align:right;font-size:.8rem}
td .name{font-weight:600}
mark{background:var(--hi);color:inherit;padding:0 1px;border-radius:2px}
.note{color:var(--tan-ink);font-size:.78rem;font-style:italic}
.result-w{color:var(--forest);font-weight:700}.result-l{color:#9b2c2c;font-weight:700}
.empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:1rem;background:var(--card);border:1px dashed var(--card-line);border-radius:8px}
.pcard{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;background:var(--card);border:1px solid var(--card-line);border-left:5px solid var(--forest);border-radius:8px;padding:14px 18px;margin-bottom:22px}
.pcard .who{font-size:1.15rem;font-weight:700;color:var(--forest)}
.pcard .stat{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:var(--tan)}
.pcard .stat b{color:var(--ink);font-size:.95rem;letter-spacing:0;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--tan);color:var(--forest-dark);vertical-align:middle;margin-left:6px}
tr.live td{background:var(--live-row)}
.notes{background:var(--card);border:1px solid var(--card-line);border-left:5px solid var(--tan);border-radius:8px;padding:14px 18px;margin-bottom:22px;font-size:.9rem}
.notes h3{margin:0 0 6px;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--tan)}
.notes ul{margin:0;padding-left:18px}.notes li{margin:3px 0}
.kpis{display:flex;flex-wrap:wrap;gap:12px 26px;font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:var(--tan);margin-bottom:14px}
.kpis b{color:var(--forest);font-size:1.6rem;letter-spacing:0;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.gtype{font-size:.66rem;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--tan-ink)}
footer .wrap{padding-block:16px 28px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 20px;border-top:1px solid var(--card-line)}
@media (prefers-reduced-motion:no-preference){.tab,#clear{transition:background .15s,color .15s}}
.embedded .bar{position:static;box-shadow:none}
.embedded th{position:static}
.embedded body{overflow:hidden}
html.embedded{overflow:hidden}
</style>

<header class="band"><div class="wrap">
  <div>
    <p class="eyebrow">The Villages High School · Buffalo Athletics</p>
    <h1>Boys Basketball <span>Record Book</span></h1>
  </div>
  <div class="meta"><span hidden><b id="m-records">0</b> records</span><span><b id="m-players">0</b> players</span><span><b id="m-opps">0</b> opponents</span><span>2005 – present</span><span id="m-live" hidden></span></div>
</div></header>

<div class="bar"><div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="controls">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="q" type="search" placeholder="Search this list — player, opponent, season, date…" autocomplete="off"></label>
    <select id="f-cat" class="sel" aria-label="Category"></select>

  <div id="results"></div>
</div></main>

<footer><div class="wrap"><span>Source: VHS Boys Basketball Record Book, revised 3.14.2026. In-season stats via MaxPreps.</span><span>Ranks reflect the order within each list in the record book.</span><span id="src-notes"></span></div></footer>

<script id="data" type="application/json">__DATA__</script>
<script>__ENGINE__</script>
<script>
(function(){
const BASE = JSON.parse(document.getElementById('data').textContent);
let DATA = BASE.slice();
let LIVE = { seasons: [], config: null, notes: [] };
const SECTIONS = [
  ['career','Career'],['ind_season','Single Season'],['ind_game','Single Game'],
  ['team_season','Team Season'],['team_game','Team Game'],['alltime','All-Time vs.'],['coaching','Coaching'],['season','This Season']];

const SECNAME = Object.fromEntries(SECTIONS);
function prepare(rows){
  rows.forEach(r=>{
    r.who = r.player || r.opponent || r.coach || '';
    r.hay = [r.who, r.category, r.season, r.date_text, r.value_text, r.result, SECNAME[r.section], r.note, r.live?'live':''].filter(Boolean).join(' ').toLowerCase();
  });
  const seen = {};
  rows.forEach(r=>{ if(r.rank) return; const k=r.section+'|'+r.category; seen[k]=(seen[k]||0)+1; r.rank=seen[k]; });
}
prepare(DATA);

const $ = s=>document.querySelector(s);
const el = {tabs:$('#tabs'), q:$('#q'), cat:$('#f-cat'), who:$('#f-who'), season:$('#f-season'), res:$('#results'), clear:$('#clear'), pcard:$('#pcard')};
const DEFAULT = {section:'career', cat:'Points'};
let state = {section:DEFAULT.section, q:'', cat:DEFAULT.cat, who:'', season:'', sort:null};

function headerStats(){
  $('#m-records').textContent = DATA.length;
  $('#m-players').textContent = new Set(DATA.filter(r=>r.player).map(r=>r.player)).size;
  $('#m-opps').textContent = DATA.filter(r=>r.section==='alltime').length;
  $('#n-total').textContent = DATA.length;
  const notes = DATA.filter(r=>r.note).length;
  $('#src-notes').textContent = notes ? notes+' rows carry a note where the source entry was incomplete or mistyped.' : '';
}
headerStats();

// tabs
SECTIONS.forEach(([k,label])=>{
  const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.textContent=label; b.dataset.k=k;
  b.setAttribute('aria-selected', k===state.section);
  b.onclick=()=>{ state.section=k; state.cat=({team_game:'High Point Games', team_season:'Wins', coaching:'Coaching Record'})[k]||'Points'; state.who=''; state.sort=null; syncTabs(); fillSelects(); render(); };
  el.tabs.appendChild(b);
});
function syncTabs(){ [...el.tabs.children].forEach(b=>b.setAttribute('aria-selected', b.dataset.k===state.section)); }

function uniq(arr){ return [...new Set(arr.filter(Boolean))]; }
function setOptions(sel, values, keep, first){
  sel.innerHTML='';
  if(first!==null){ const o=document.createElement('option'); o.value=''; o.textContent=first; sel.appendChild(o); }
  values.forEach(v=>{ const x=document.createElement('option'); x.value=v; x.textContent=v; sel.appendChild(x); });
  sel.value = values.includes(keep) ? keep : (first===null && values.length ? values[0] : '');
}
function base(){ if(state.section==='season') return []; return DATA.filter(r=>r.section===state.section); }
function fillSelects(){
  const b=base();
  // one category at a time, listed alphabetically; no "all categories" option
  const cats = uniq(b.map(r=>r.category)).sort((a,b)=>a.localeCompare(b));
  setOptions(el.cat, cats, state.cat, null); state.cat=el.cat.value; el.cat.disabled = state.section==='season';
  const isPlayers = state.section.startsWith('ind') || state.section==='career';
  const whos = uniq(b.map(r=> isPlayers ? r.player : state.section==='coaching' ? r.coach : r.opponent)).sort((a,b)=>a.localeCompare(b));
  setOptions(el.who, whos, state.who, state.section==='alltime' ? 'All opponents' : state.section==='coaching' ? 'All coaches' : state.section.startsWith('team') ? 'All opponents' : 'All players');
  state.who=el.who.value;
  const seasons = uniq(b.map(r=>r.season)).filter(s=>/^\d{4}/.test(s)).sort().reverse();
  setOptions(el.season, seasons, state.season, 'All seasons'); state.season=el.season.value;
}

function filtered(){
  const q=state.q.trim().toLowerCase(); const terms=q.split(/\s+/).filter(Boolean);
  return base().filter(r=>{
    if(state.cat && r.category!==state.cat) return false;
    if(state.who && r.who!==state.who) return false;
    if(state.season && r.season!==state.season) return false;
    return terms.every(t=>r.hay.includes(t));
  });
}

function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(s){
  s=esc(s); const terms=state.q.trim().split(/\s+/).filter(t=>t.length>1);
  terms.forEach(t=>{ s=s.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); });
  return s;
}
const COLS = {
  ind_game:  [['rank','#'],['value','Value','num'],['player','Player'],['date_text','Date'],['opponent','Opponent'],['season','Season']],
  ind_season:[['rank','#'],['value','Value','num'],['player','Player'],['season','Season']],
  career:    [['rank','#'],['value','Value','num'],['player','Player'],['season','Years']],
  team_game: [['rank','#'],['value','Value','num'],['opponent','Opponent'],['date_text','Date'],['season','Season'],['result','Result']],
  team_season:[['rank','#'],['season','Season'],['value','Value','num']],
  alltime:   [['opponent','Opponent'],['value_text','Record'],['wins','W','num'],['losses','L','num'],['games','GP','num'],['pct','Win %','num']],
  coaching:  [['coach','Coach'],['season','Years / Season'],['value_text','Record / Count'],['pct','Win %','num']]
};
function cell(r,key){
  let v=r[key];
  if(key==='value'){ return r.value_text ?? v; }
  if(key==='pct') return v==null?'':(v===1?'1.000':v.toFixed(3).replace(/^0/,''));
  if(key==='result') return v ? `<span class="${v==='Won'?'result-w':'result-l'}">${v}</span>` : '';
  if(key==='season' && v==='(unlabeled)') return `<span class="note">season not given</span>`;
  if(key==='season' && v==='(total)') return `<span class="note">total</span>`;
  if(key==='player'||key==='opponent'||key==='coach') return `<span class="name">${hl(v)}</span>`+(r.live?'<span class="chip">Live</span>':'')+(r.unmatched?' <span class="note">new — verify name</span>':'');
  if(key==='season' && r.live && r.section==='team_season') return hl(v)+'<span class="chip">Live</span>';
  if(key==='rank') return v;
  return hl(v==null?'':v);
}
function sortRows(rows, sec){
  if(!state.sort) return rows;
  const [key,dir]=state.sort; const m=dir==='asc'?1:-1;
  return [...rows].sort((a,b)=>{ let x=a[key], y=b[key];
    if(key==='value'){ x=a.value??-Infinity; y=b.value??-Infinity; }
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==='number'&&typeof y==='number') return (x-y)*m;
    return String(x).localeCompare(String(y),undefined,{numeric:true})*m; });
}
const PAGE=100; state.expanded=state.expanded||{};
function table(rows, sec, gkey){
  const cols=COLS[sec];
  const all=sortRows(rows,sec); const limit=(gkey&&state.expanded[gkey])?all.length:PAGE; const shown=all.slice(0,limit);
  let h='<div class="tablewrap"><table><thead><tr>'+cols.map(([k,l,cls])=>`<th class="${cls||''}"><button type="button" data-key="${k}" data-dir="${state.sort&&state.sort[0]===k?state.sort[1]:''}">${l}</button></th>`).join('')+'</tr></thead><tbody>';
  shown.forEach(r=>{ h+='<tr'+(r.live?' class="live"':'')+'>'+cols.map(([k,l,cls])=>`<td class="${cls||''}${k==='rank'?' rank':''}">${cell(r,k)}</td>`).join('')+'</tr>'; });
  h+='</tbody></table></div>';
  if(all.length>limit) h+=`<div class="more"><button type="button" class="morebtn" data-group="${esc(gkey)}">Show all ${all.length.toLocaleString()} entries</button><span>Showing the top ${limit}</span></div>`;
  return h;
}
function render(){
  renderNotes();
  if(state.section==='season'){ renderSeason(); $('#n-shown').textContent=0; el.pcard.hidden=true; $('#results').innerHTML=''; $('#hint').textContent=''; return; }
  $('#seasonview').hidden=true;
  const rows=filtered();
  $('#n-shown').textContent=rows.length;
  el.pcard.hidden=true;
  if(state.who && (state.section.startsWith('ind')||state.section==='career')){
    const mine=DATA.filter(r=>r.player===state.who);
    if(mine.length){
      const c=k=>mine.find(r=>r.section==='career'&&r.category===k);
      const pts=c('Points'), reb=c('Rebounds'), ast=c('Assists');
      const years=uniq(mine.map(r=>r.season).filter(s=>/^\d{4}/.test(s))).sort();
      const yrs=(c('Points')||c('Field Goals Made')||{}).season || (years.length?years[0].slice(0,4)+'–'+years[years.length-1].slice(-4):'');
      const g=mine.filter(r=>r.section==='ind_game').length, s=mine.filter(r=>r.section==='ind_season').length, cr=mine.filter(r=>r.section==='career').length;
      el.pcard.innerHTML=`<span class="who">${esc(state.who)}</span>`+(yrs?`<span class="stat">${esc(yrs)}</span>`:'')+
        `<span class="stat">Single-game entries <b>${g}</b></span><span class="stat">Season entries <b>${s}</b></span><span class="stat">Career entries <b>${cr}</b></span>`+
        (pts?`<span class="stat">Career points <b>${pts.value_text}</b></span>`:'')+(reb?`<span class="stat">Career rebounds <b>${reb.value_text}</b></span>`:'')+(ast?`<span class="stat">Career assists <b>${ast.value_text}</b></span>`:'');
      el.pcard.hidden=false;
    }
  }
  if(!rows.length){ el.res.innerHTML='<div class="empty">No records match. Try fewer words, or reset the filters.</div>'; $('#hint').textContent=''; return; }
  // group by section + category, in document order
  const groups=new Map();
  rows.forEach(r=>{ const k=r.section+'|'+r.category; if(!groups.has(k)) groups.set(k,{sec:r.section,cat:r.category,rows:[]}); groups.get(k).rows.push(r); });
  let h='';
  for(const g of groups.values()){
    const total=DATA.filter(r=>r.section===g.sec&&r.category===g.cat).length;
    h+=`<section class="group"><h2>${esc(g.cat)} <small>${g.rows.length===total?total+' listed':g.rows.length+' of '+total}</small></h2>${table(g.rows,g.sec,g.sec+'|'+g.cat)}</section>`;
  }
  el.res.innerHTML=h;
  $('#hint').textContent = state.sort ? 'Sorted by '+state.sort[0]+' ('+state.sort[1]+'). Click a header again to flip, or Reset to restore record-book order.' : 'Click any column header to sort.';
}
el.res.addEventListener('click',e=>{
  const mb=e.target.closest('.morebtn'); if(mb){ state.expanded[mb.dataset.group]=true; render(); return; }
  const b=e.target.closest('th button'); if(!b) return;
  const k=b.dataset.key; state.sort = (state.sort&&state.sort[0]===k) ? [k, state.sort[1]==='desc'?'asc':'desc'] : [k, (k==='rank'||k==='player'||k==='opponent'||k==='coach'||k==='season'||k==='date_text')?'asc':'desc'];
  render();
});
let t; el.q.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=el.q.value; render(); },120); });
el.cat.onchange=()=>{state.cat=el.cat.value; render();};
el.who.onchange=()=>{state.who=el.who.value; render();};
el.season.onchange=()=>{state.season=el.season.value; render();};
el.clear.onclick=()=>{ state={section:DEFAULT.section,q:'',cat:DEFAULT.cat,who:'',season:'',sort:null}; el.q.value=''; syncTabs(); fillSelects(); render(); };
function renderNotes(){
  const box=$('#livenotes'); const items=[];
  if(LIVE.seasons.length){ const cur=LIVE.seasons[LIVE.seasons.length-1]; if(LIVE.notes.length) LIVE.notes.forEach(n=>items.push(n)); }
  box.hidden=!items.length; box.innerHTML=items.length?'<h3>Needs a look</h3><ul>'+items.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'';
}
function renderSeason(){
  const v=$('#seasonview'); v.hidden=false;
  const cur=LIVE.seasons.filter(s=>!LIVE.config||s.season>(LIVE.config.bookThrough||'2025-2026')).slice(-1)[0];
  if(!cur){ v.innerHTML='<div class="empty">No live season data yet. The MaxPreps sync fills this in once the 2026-27 season starts (November 1).</div>'; return; }
  const d=RecordsEngine.seasonDerived(cur, LIVE.config||{});
  const T=cur.teamTotals||{};
  let h=`<div class="kpis"><span><b>${cur.record.wins}-${cur.record.losses}</b>Record</span><span><b>${cur.games.length}</b>Games</span><span><b>${T.pts??'–'}</b>Points</span><span><b>${T.gp?fmtAvg(T.pts/T.gp):'–'}</b>Avg</span><span><b>${d.districtTourneyWins}</b>District tourney W</span><span><b>${d.stateGames}</b>State series games</span><span class="note" style="align-self:end">MaxPreps sync ${new Date(cur.scrapedAt).toLocaleString()}</span></div>`;
  const P=cur.players.slice().sort((a,b)=>(b.pts||0)-(a.pts||0));
  h+='<section class="group"><h2>Player totals <small>'+cur.season+'</small></h2><div class="tablewrap"><table><thead><tr><th>Player</th><th>Cl</th><th class="num">GP</th><th class="num">Pts</th><th class="num">PPG</th><th class="num">FG</th><th class="num">FG%</th><th class="num">3P</th><th class="num">3P%</th><th class="num">FT</th><th class="num">FT%</th><th class="num">Reb</th><th class="num">RPG</th><th class="num">Ast</th><th class="num">Stl</th><th class="num">Blk</th><th class="num">Chg</th></tr></thead><tbody>';
  P.forEach(p=>{ h+=`<tr><td><span class="name">${esc(p.name)}</span></td><td>${esc(p.cls||'')}</td><td class="num">${p.gp??''}</td><td class="num">${p.pts??''}</td><td class="num">${p.gp?fmtAvg(p.pts/p.gp):''}</td><td class="num">${p.fgm??''}-${p.fga??''}</td><td class="num">${p.fga?fmtPct(p.fgm/p.fga):''}</td><td class="num">${p.fg3m??''}-${p.fg3a??''}</td><td class="num">${p.fg3a?fmtPct(p.fg3m/p.fg3a):''}</td><td class="num">${p.ftm??''}-${p.fta??''}</td><td class="num">${p.fta?fmtPct(p.ftm/p.fta):''}</td><td class="num">${p.reb??''}</td><td class="num">${p.gp?fmtAvg(p.reb/p.gp):''}</td><td class="num">${p.ast??''}</td><td class="num">${p.stl??''}</td><td class="num">${p.blk??''}</td><td class="num">${p.charges??''}</td></tr>`; });
  h+='</tbody></table></div></section>';
  h+='<section class="group"><h2>Game log <small>'+cur.games.length+' games</small></h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Opponent</th><th>Site</th><th>Type</th><th>Result</th><th class="num">Score</th><th class="num">FG</th><th class="num">3P</th><th class="num">FT</th><th class="num">Reb</th><th class="num">Ast</th><th class="num">Stl</th><th class="num">Blk</th><th>High scorer</th></tr></thead><tbody>';
  const cutoff=((LIVE.config||{}).districtTourneyCutoff)||'02-13'; const cut=cur.season.split('-')[1]+'-'+cutoff;
  cur.games.forEach(g=>{ const t=g.team||{}; const top=(g.box||[]).slice().sort((a,b)=>(b.pts||0)-(a.pts||0))[0]; const type=g.type==='playoff'?(g.date<cut?'District tourney':'State series'):g.type; h+=`<tr><td>${RecordsEngine.fmtDate(g.date)}</td><td><span class="name">${esc(g.opponent)}</span></td><td>${g.site}</td><td class="gtype">${esc(type)}</td><td><span class="${g.result==='Won'?'result-w':'result-l'}">${g.result}</span></td><td class="num">${g.us}-${g.them}</td><td class="num">${t.fgm??''}-${t.fga??''}</td><td class="num">${t.fg3m??''}-${t.fg3a??''}</td><td class="num">${t.ftm??''}-${t.fta??''}</td><td class="num">${t.reb??''}</td><td class="num">${t.ast??''}</td><td class="num">${t.stl??''}</td><td class="num">${t.blk??''}</td><td>${top?esc(top.name)+' '+top.pts:''}</td></tr>`; });
  h+='</tbody></table></div></section>';
  v.innerHTML=h;
}
function fmtPct(v){ return v==null?'':(v>=1?'1.000':v.toFixed(3).replace(/^0/,'')); }
function fmtAvg(v){ return v==null?'':(Math.round(v*10)/10).toFixed(1); }
function applyLive(){
  try{
    const res=RecordsEngine.computeLive(BASE, LIVE.seasons.slice().sort((a,b)=>a.season.localeCompare(b.season)), LIVE.config||{});
    LIVE.notes=res.notes;
    const manual=(LIVE.config&&LIVE.config.manualReminder)||'District wins, district tournament wins, state tournament games, District/Region championships and the coaching championship/playoff lists are entered by hand (tell Claude or edit the baseline).';
    if(res.liveSeasons.length) LIVE.notes=[...res.notes, manual];
    DATA=RecordsEngine.merge(BASE.map(r=>Object.assign({},r)), res);
    prepare(DATA);
    const chip=$('#m-live');
    if(res.liveSeasons.length){ const cur=LIVE.seasons.find(s=>s.season===res.liveSeasons[res.liveSeasons.length-1]); chip.hidden=false; chip.innerHTML='<b>'+res.rows.length+'</b> live · '+esc(cur.season)+' synced '+new Date(cur.scrapedAt).toLocaleDateString(); }
    else chip.hidden=true;
    headerStats(); fillSelects(); render();
  }catch(e){ console.error('live merge failed', e); }
}
(async()=>{
  const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if(!db){
    // Static hosting (GitHub Pages / iframe): read the JSON files the sync task commits to data/
    try{
      const cfg = await fetch('data/config.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
      const idx = await fetch('data/seasons/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
      if(!idx||!Array.isArray(idx.seasons)) return;
      const docs = await Promise.all(idx.seasons.map(id=>fetch('data/seasons/'+id+'.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)));
      LIVE.config = cfg; LIVE.seasons = docs.filter(s=>s&&s.season&&s.games); applyLive();
    }catch(e){ console.warn('static live data', e); }
    return;
  }
  let gotCfg=false, gotSeasons=false;
  db.doc('config/main').onSnapshot(snap=>{ LIVE.config = snap.exists ? snap.data() : null; gotCfg=true; if(gotSeasons) applyLive(); }, e=>console.warn('config', e));
  db.collection('seasons').onSnapshot(snap=>{ LIVE.seasons = snap.docs.filter(d=>d.exists).map(d=>d.data()).filter(s=>s&&s.season&&s.games); gotSeasons=true; if(gotCfg) applyLive(); }, e=>console.warn('seasons', e));
})();
fillSelects(); render();
// Embedded (iframe) mode: report our height so the host page can size the frame and avoid inner scrolling.
(function(){
  if(window.parent===window) return;
  document.documentElement.classList.add('embedded');
  let last=0;
  const post=()=>{ const r=document.body.getBoundingClientRect(); const h=Math.ceil(r.top+r.height+window.scrollY); if(Math.abs(h-last)<2) return; last=h; try{ window.parent.postMessage({type:'vhs-records-height', height:h}, '*'); }catch(e){} };
  if('ResizeObserver' in window) new ResizeObserver(post).observe(document.body);
  window.addEventListener('load', post); setInterval(post, 1500); post();
  // host may ask for the height explicitly
  window.addEventListener('message', e=>{ if(e.data && e.data.type==='vhs-records-height?') { last=0; post(); } });
})();
})();
</script>
